{% extends "admin/base.html" %}
{% block admin_content %}
<h2 class="fw-bold mb-4">{{ 'Edit' if affiliate else 'New' }} Affiliate</h2>
<div class="row">
  <div class="col-md-8">
    <form method="POST">
      <div class="card-ink p-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold">Name</label>
            <input type="text" name="name" class="form-control form-control-sm" value="{{ affiliate.name if affiliate else '' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold">Email</label>
            <input type="email" name="email" class="form-control form-control-sm" value="{{ affiliate.email if affiliate else '' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold">Phone</label>
            <input type="text" name="phone" class="form-control form-control-sm" value="{{ affiliate.phone if affiliate else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold">PayPal Email</label>
            <input type="email" name="paypal_email" class="form-control form-control-sm" value="{{ affiliate.paypal_email if affiliate else '' }}">
          </div>
        </div>
        <hr class="my-3">
        <h6 class="fw-bold mb-2">Commission Rates (%)</h6>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label small">Chinese Courses</label>
            <input type="number" step="1" min="0" max="50" name="rate_chinese" class="form-control form-control-sm"
              value="{{ (affiliate.commission_rate_chinese * 100)|round if affiliate else 5 }}">
          </div>
          <div class="col-md-4">
            <label class="form-label small">Tai Chi Courses</label>
            <input type="number" step="1" min="0" max="50" name="rate_taichi" class="form-control form-control-sm"
              value="{{ (affiliate.commission_rate_taichi * 100)|round if affiliate else 8 }}">
          </div>
          <div class="col-md-4">
            <label class="form-label small">Custom Travel</label>
            <input type="number" step="1" min="0" max="50" name="rate_travel" class="form-control form-control-sm"
              value="{{ (affiliate.commission_rate_travel * 100)|round if affiliate else 10 }}">
          </div>
        </div>
        <hr class="my-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold">Status</label>
            <select name="status" class="form-select form-select-sm">
              <option value="active" {{ 'selected' if affiliate and affiliate.status == 'active' }}>Active</option>
              <option value="inactive" {{ 'selected' if affiliate and affiliate.status == 'inactive' }}>Inactive</option>
            </select>
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label small fw-bold">Notes</label>
          <textarea name="notes" class="form-control form-control-sm" rows="3">{{ affiliate.notes if affiliate else '' }}</textarea>
        </div>
        {% if affiliate %}
        <div class="mt-3 p-2 rounded" style="background:var(--paper-warm);">
          <small class="text-muted">Referral Code: <code>{{ affiliate.referral_code }}</code><br>
          Referral Link: <code>{{ request.host_url }}?ref={{ affiliate.referral_code }}</code></small>
        </div>
        {% endif %}
        <div class="mt-3">
          <button type="submit" class="btn btn-cinnabar">Save</button>
          <a href="{{ url_for('admin.affiliates') }}" class="btn btn-outline-ink ms-2">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
