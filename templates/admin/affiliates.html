{% extends "admin/base.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">Affiliates</h2>
  <a href="{{ url_for('admin.affiliate_form') }}" class="btn btn-cinnabar btn-sm">+ New Affiliate</a>
</div>
<div class="table-responsive">
  <table class="admin-table">
    <thead>
      <tr><th>Name</th><th>Code</th><th>Email</th><th>Status</th><th>Created</th><th></th></tr>
    </thead>
    <tbody>
      {% for aff in affiliates %}
      <tr>
        <td><a href="{{ url_for('admin.affiliate_detail', id=aff.id) }}">{{ aff.name }}</a></td>
        <td><code>{{ aff.referral_code }}</code></td>
        <td class="text-muted">{{ aff.email }}</td>
        <td><span class="badge-status badge-{{ aff.status }}">{{ aff.status }}</span></td>
        <td class="text-muted small">{{ aff.created_at.strftime('%Y-%m-%d') }}</td>
        <td>
          <a href="{{ url_for('admin.affiliate_form', id=aff.id) }}" class="btn btn-sm btn-outline-ink">Edit</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
