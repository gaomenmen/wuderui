{% extends "admin/base.html" %}
{% block admin_content %}
<h2 class="fw-bold mb-4">{% if item %}<span class="en">Edit Course</span><span class="zh">编辑课程</span>{% else %}<span class="en">New Course</span><span class="zh">新建课程</span>{% endif %}</h2>
<form method="POST" class="card-ink p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label small fw-bold">Name (EN)</label><input name="name_en" class="form-control form-control-sm" value="{{ item.name_en if item else '' }}" required></div>
    <div class="col-md-6"><label class="form-label small fw-bold">Name (ZH)</label><input name="name_zh" class="form-control form-control-sm" value="{{ item.name_zh if item else '' }}"></div>
    <div class="col-md-4"><label class="form-label small fw-bold">Category</label>
      <select name="category" class="form-select form-select-sm">
        {% for cat in categories %}<option value="{{ cat }}" {{ 'selected' if item and item.category == cat }}>{{ cat }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3"><label class="form-label small fw-bold">Price</label><input name="price" type="number" step="0.01" class="form-control form-control-sm" value="{{ item.price if item and item.price else '' }}"></div>
    <div class="col-md-2"><label class="form-label small fw-bold">Currency</label><input name="currency" class="form-control form-control-sm" value="{{ item.currency if item else 'USD' }}"></div>
    <div class="col-md-2"><label class="form-label small fw-bold">Order</label><input name="sort_order" type="number" class="form-control form-control-sm" value="{{ item.sort_order if item else 0 }}"></div>
    <div class="col-md-1 d-flex align-items-end"><div class="form-check"><input id="is_active" type="checkbox" name="is_active" class="form-check-input" {{ 'checked' if (item is none) or item.is_active }}><label for="is_active" class="form-check-label small">On</label></div></div>
    <div class="col-12"><label class="form-label small fw-bold">Cover Image URL</label><input name="cover_image" class="form-control form-control-sm" value="{{ item.cover_image if item else '' }}"></div>
    <div class="col-12"><label class="form-label small fw-bold">Sample Video URL</label><input name="sample_video_url" class="form-control form-control-sm" value="{{ item.sample_video_url if item else '' }}"></div>
    <div class="col-md-6"><label class="form-label small fw-bold">Description (EN)</label><textarea name="description_en" rows="4" class="form-control form-control-sm">{{ item.description_en if item else '' }}</textarea></div>
    <div class="col-md-6"><label class="form-label small fw-bold">Description (ZH)</label><textarea name="description_zh" rows="4" class="form-control form-control-sm">{{ item.description_zh if item else '' }}</textarea></div>
  </div>
  <div class="mt-3">
    <button class="btn btn-cinnabar">Save</button>
    <a href="{{ url_for('admin.chinese_courses') }}" class="btn btn-outline-ink ms-2">Cancel</a>
  </div>
</form>
{% endblock %}
