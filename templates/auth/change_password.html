<!DOCTYPE html>
<html lang="en" class="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — WuDeRuiBo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(170deg, #2c2c2c 0%, #1a1a1a 100%);
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: #faf9f6; border-radius: 12px; padding: 2.5rem;
            width: 100%; max-width: 420px; border: 1px solid rgba(0,0,0,.06);
        }
        .login-card h2 { font-family: 'Playfair Display', serif; }
        .login-card .seal {
            display: inline-block; border: 2px solid #c23a2a; color: #c23a2a;
            padding: 2px 8px; font-size: .75rem; letter-spacing: 2px;
            font-family: 'Noto Serif SC', serif; transform: rotate(-2deg);
        }
        .btn-cinnabar { background: #b5362e; color: #fff; border: none; border-radius: 6px; }
        .btn-cinnabar:hover { background: #d4564e; color: #fff; }
        .alert { font-size: .85rem; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <span class="seal">吴德瑞博</span>
        <h2 class="fw-bold mt-2 mb-1">
            <span class="en">Change Password</span><span class="zh">修改密码</span>
        </h2>
        <small class="text-muted">
            <span class="en">Required on first login</span><span class="zh">首次登录必须修改</span>
        </small>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else ('warning' if category == 'warning' else 'success') }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label small fw-bold">
                <span class="en">Current Password</span><span class="zh">当前密码</span>
            </label>
            <input type="password" name="old_password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">
                <span class="en">New Password (min 8 chars)</span><span class="zh">新密码（至少8位）</span>
            </label>
            <input type="password" name="new_password" class="form-control" required minlength="8">
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">
                <span class="en">Confirm New Password</span><span class="zh">确认新密码</span>
            </label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-cinnabar w-100">
            <span class="en">Update Password</span><span class="zh">更新密码</span>
        </button>
    </form>
</div>
</body>
</html>
