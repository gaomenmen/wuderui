{% extends "base.html" %}
{% block content %}
<div class="container py-5 text-center" style="max-width:600px;">
  <i class="bi bi-x-circle-fill" style="font-size:4rem;color:#c62828;"></i>
  <h2 class="fw-bold mt-3"><span class="en">Payment Failed</span><span class="zh">支付未成功</span></h2>
  <p class="text-muted">
    <span class="en">Order <code>{{ order.order_no }}</code> — please try again or contact us.</span>
    <span class="zh">订单号 <code>{{ order.order_no }}</code> — 请重试或联系我们。</span>
  </p>
  <a href="{{ url_for('contact.contact') }}" class="btn btn-cinnabar"><span class="en">Contact Support</span><span class="zh">联系客服</span></a>
  <a href="{{ url_for('main.home') }}" class="btn btn-outline-ink ms-2"><span class="en">Home</span><span class="zh">首页</span></a>
</div>
{% endblock %}
