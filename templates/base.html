<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}WuDeRuiBo - 吴德瑞博{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand"><b>WuDeRuiBo 吴德瑞博</b></a>
    <div class="float-end">
      <a href="?lang=zh" class="btn btn-link">中文</a>/<a href="?lang=en" class="btn btn-link">EN</a>
    </div>
  </div>
  <div class="container-fluid">
    <ul class="nav">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">{{ _('Home') }}</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('learn_chinese') }}">{{ _('Learn Chinese') }}</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('tai_chi') }}">{{ _('Tai Chi') }}</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('custom_trips') }}">{{ _('Custom Trips') }}</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">{{ _('About') }}</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">{{ _('Contact') }}</a></li>
    </ul>
  </div>
</nav>
<div class="container my-5">
    {% block content %}{% endblock %}
</div>
<footer class="footer mt-auto py-3 bg-light">
  <div class="container">
    <span class="text-muted">&copy; WuDeRuiBo {{ _('All Rights Reserved.') }}</span>
  </div>
</footer>
</body>
</html>
